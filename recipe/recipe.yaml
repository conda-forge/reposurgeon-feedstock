schema_version: 1

context:
  version: "5.9"

package:
  name: reposurgeon
  version: ${{ version }}

source:
  url: https://gitlab.com/esr/reposurgeon/-/archive/${{ version }}/reposurgeon-${{ version }}.tar.gz
  sha256: f1b2c8f76bfaf6bfe19a625bb14c5e4c9a494c17f4591bdbc6c7796226d7365b

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - asciidoctor
    - go-licenses
    - git
    - make

tests:
  - script:
      - reposurgeon --help

about:
  license: BSD-2-Clause
  license_file:
    - COPYING
    - license-files_repocutter/
    - license-files_repomapper/
    - license-files_reposurgeon/
    - license-files_repotool/
  summary: Edit version-control repository history
  homepage: http://www.catb.org/esr/reposurgeon
  repository: https://gitlab.com/esr/reposurgeon

extra:
  recipe-maintainers:
    - danielnachun
